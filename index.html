// ===== IMPORT REVIEW FROM EXCEL =====
async function importReviewFromExcel(e) {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = ''; // reset so same file can be picked again

  try {
    const buffer = await file.arrayBuffer();
    const wb = XLSX.read(buffer, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    // Build key→value map from two-column layout (our export format)
    const map = {};
    rows.forEach(row => {
      const rawKey = String(row[0] || '').trim();
      const val    = String(row[1] || '').trim();
      if (rawKey && val) {
        // normalize: lowercase, replace spaces/special chars with _
        const key = rawKey.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
        map[key] = val;
        map[rawKey] = val; // also keep original for direct field key matching
      }
    });

    // Detect device type from the sheet content
    const typeMap = {
      'smartphone': 'smartphone', 'smartwatch': 'smartwatch',
      'tws': 'tws', 'tws_earbuds': 'tws', 'earbuds': 'tws',
    };
    let detectedType = curTab; // default to current tab
    const typeVal = (map['type'] || map['category'] || map['tipo'] || map['categoria'] || '').toLowerCase();
    for (const [k, v] of Object.entries(typeMap)) {
      if (typeVal.includes(k)) { detectedType = v; break; }
    }

    // Label → field key mapping (matches our export format)
    const LABEL_MAP = {
      // Header labels from our export
      'brand': 'brand', 'marca': 'brand',
      'model': 'model', 'model_name': 'model', 'nome_do_modelo': 'model', 'modelo': 'model',
      'reviewer': 'reviewer', 'reviewer_name': 'reviewer', 'nome_do_avaliador': 'reviewer',
      'retail_price_brl_': 'retail_price', 'price_brl_': 'retail_price', 'preco_brl_': 'retail_price',
      'market_segment': 'positioning', 'posicionamento': 'positioning', 'positioning': 'positioning',
      // Scores
      'price_value': 's_price', 'preco_e_valor': 's_price', 'pre_o_e_valor': 's_price',
      'screen_display': 's_display', 'tela_e_display': 's_display', 'display': 's_display',
      'speed_performance': 's_perf', 'velocidade_e_desempenho': 's_perf', 'performance': 's_perf',
      'camera_photos': 's_cam', 'c_mera_e_fotos': 's_cam', 'camera': 's_cam',
      'battery_charging': 's_batt', 'bateria_e_carregamento': 's_batt', 'battery': 's_batt',
      'software_user_experience': 's_sw', 'software': 's_sw',
      'design_build_quality': 's_build', 'design_e_qualidade': 's_build', 'build': 's_build',
      'calls_speaker_connectivity': 's_calls', 'calls': 's_calls',
      'design_comfort_wearability': 's_design', 'design': 's_design',
      'screen_watch_faces_visibility': 's_display',
      'ease_of_use_navigation': 's_usability',
      'sports_fitness_gps': 's_sports',
      'health_sleep_tracking': 's_health',
      'smart_features_connectivity': 's_smart',
      'battery_life_charging': 's_batt',
      'companion_app_experience': 's_app',
      'sound_quality': 's_sound',
      'noise_cancelling_transparency': 's_anc',
      'design_fit_build': 's_design',
      'battery_life': 's_batt',
      'calls_connection': 's_conn',
      'controls_companion_app': 's_ctrl',
      // Verdict
      'pros': 'pros', 'pontos_positivos': 'pros',
      'cons': 'cons', 'pontos_negativos': 'cons',
      'final_verdict': 'final_verdict', 'veredicto_final': 'final_verdict',
    };

    const review = {
      id: genId(),
      type: detectedType,
      completed: true,
      created_at: Date.now(),
    };

    // Apply mapped fields
    Object.entries(map).forEach(([rawKey, val]) => {
      if (!val || val === '—') return;
      const normKey = rawKey.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
      const fieldKey = LABEL_MAP[normKey] || LABEL_MAP[rawKey];
      if (fieldKey) {
        // Score fields: parse as number
        if (fieldKey.startsWith('s_')) {
          const n = parseFloat(val);
          if (!isNaN(n)) review[fieldKey] = n;
        } else {
          review[fieldKey] = val;
        }
        return;
      }
      // Direct field key match (for our own export which uses field keys as labels)
      const allKeys = new Set();
      Object.values(DEFS).forEach(def =>
        def.sections.forEach(sec => (sec.f||[]).forEach(f => allKeys.add(f.k)))
      );
      if (allKeys.has(rawKey)) review[rawKey] = val;
      if (allKeys.has(normKey)) review[normKey] = val;
    });

    // Validate we got something useful
    if (!review.brand && !review.model) {
      alert('✗ ' + (t('xl_import_no_data') || 'No matching fields found. Make sure this is a JOVI review export file.'));
      return;
    }

    // Save directly to Supabase
    await updateReview(review);

    // Switch to correct tab and refresh
    const tabBtn = document.querySelector(`.tab[data-tab="${detectedType}"]`);
    if (tabBtn) {
      curTab = detectedType;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tabBtn.classList.add('active');
      document.getElementById('cta-banner').style.background = TYPE_COLORS[curTab];
      document.getElementById('cta-title').textContent = t('new_review') + ' — ' + TYPE_LABELS[curTab];
    }

    await renderList();

    const name = [review.brand, review.model].filter(Boolean).join(' ') || 'Review';
    alert('✓ "' + name + '" ' + (t('xl_import_saved') || 'imported and saved successfully!'));

  } catch(err) {
    console.error('Excel import error:', err);
    alert('✗ ' + (t('xl_import_error') || 'Could not read the file. Make sure it is a valid JOVI Excel export.'));
  }
}

</script>
