  const date = s.created_at ? new Date(s.created_at).toLocaleDateString('pt-BR') : '';

  document.getElementById('sales-detail-body').innerHTML = `
    <div class="detail-hero">
      ${s.photo ? `<img class="detail-hero-photo" src="${s.photo}" alt="">` : ''}
      <div class="detail-hero-body">
        <div class="detail-hero-info">
          <div class="detail-brand" style="color:${color}">${label} · ${s.model}</div>
          <div class="detail-model">${s.cust_name || (isBuyer ? 'Customer' : 'Anonymous')}</div>
          <div class="detail-price">
            <span>${s.gender||''}</span>
            ${(s.age_range||s.apparent_age) ? `<span>·</span><span>${s.age_range||s.apparent_age}</span>` : ''}
            ${s.color_choice ? `<span>·</span><span>Color: ${s.color_choice}</span>` : ''}
            ${date ? `<span>·</span><span>${date}</span>` : ''}
          </div>
        </div>
        <div style="width:52px;height:52px;border-radius:50%;background:${color}22;border:3px solid ${color};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px">
          ${isBuyer ? '🛒' : '👤'}
        </div>
      </div>
    </div>
    ${sectionsHtml}
    <div class="action-row">
      <button class="btn-del-sm" onclick="deleteSalesFromDetail('${s.id}')">Delete</button>
      <button class="btn-export" onclick="exportSalesXlsx('${s.id}')">

        Excel

      <button class="btn-export" onclick="exportSalesPptx('${s.id}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>

function deleteSalesFromDetail(id) {
  if (!confirm('Delete this record permanently?')) return;
  deleteSalesEntry(id);
  goSales();

// ===== AI PASTE & PARSE =====
// Uses Anthropic API to extract structured review data from free text

async function parseAndFill(text) {
  const secs  = DEFS[curTab].sections.filter(s => s.k !== 'photo' && s.k !== 'verdict');
  const allFields = [];
  secs.forEach(sec => {
    (sec.f || []).forEach(f => {
      allFields.push({ key: f.k, label: f.l, hint: f.h, type: f.tp, options: f.o || [] });
    });
  });

  const fieldList = allFields.map(f => {
    const opts = f.options.length ? ` [options: ${f.options.join(' / ')}]` : '';
    return `- "${f.key}": ${f.label}${f.hint ? ' (' + f.hint + ')' : ''}${opts}`;
  }).join('\n');

  const prompt = `You are a tech review assistant. Extract information from the following text and map it to the review form fields.

DEVICE TYPE: ${TYPE_LABELS[curTab]}

AVAILABLE FORM FIELDS:
${fieldList}

Also extract if present:
- "brand": device brand
- "model": device model name
- "reviewer": reviewer name
- "retail_price": price as a number only (no currency symbol)

RULES:
- For "sel" type fields, ONLY use one of the provided options exactly as written
- For "num" type fields, return numbers only
- For "txt" and "ta" type fields, return concise relevant text
- For ratings (s_price, s_display, s_perf, s_cam, s_batt, s_sw, s_build, s_calls, s_design, s_usability, s_sports, s_health, s_smart, s_app, s_sound, s_anc, s_conn, s_ctrl), return a number 1-10 if you can infer it
- Skip fields where no relevant information exists in the text
- Also fill: "pros" (main strengths), "cons" (main weaknesses), "final_verdict" (overall summary)

INPUT TEXT:
"""
${text}
"""

Respond ONLY with a valid JSON object. No markdown, no explanation, no code blocks. Just the JSON.
Example: {"brand":"Samsung","model":"Galaxy S25","s_display":9,"display_tech":"AMOLED/OLED","pros":"Great camera","cons":"Expensive"}`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });

  const data = await response.json();
  const raw  = data.content?.map(c => c.text || '').join('') || '';
  const clean = raw.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

async function runPasteAndFill() {
  const textarea = document.getElementById('paste-input');
  const btn      = document.getElementById('paste-btn');
  const status   = document.getElementById('paste-status');
  const text     = textarea?.value?.trim();

  if (!text) return;

  btn.disabled   = true;
  btn.textContent = t('paste_loading');
  status.textContent = '';
  status.className = 'paste-status';

  try {
    const extracted = await parseAndFill(text);

    // Apply to formData and DOM
    Object.entries(extracted).forEach(([key, val]) => {
      formData[key] = val;
      // Update DOM input
      const el = document.getElementById('ff-' + key);
      if (el) {
        el.value = val;
        // For ratings, trigger the button highlight
        if (key.startsWith('s_') && typeof val === 'number') {
          // find section key
          const secs = DEFS[curTab].sections;
          secs.forEach(sec => {
            if (sec.sk === key) {
              const fakeBtn = { getAttribute: attr => attr === 'data-sec' ? sec.k : attr === 'data-sk' ? key : String(val) };
              // manually set score visuals
              const row = document.getElementById('rr-' + sec.k);
              if (row) {
                row.querySelectorAll('.rb').forEach(b => {
                  const bN = parseInt(b.getAttribute('data-n'));
                  b.className = 'rb';
                  if (bN <= val) {
                    b.classList.add('selected');
                    if (val >= 8) {} // green default
                    else if (val >= 5) b.classList.add('range-yellow');
                    else b.classList.add('range-red');
                  }
                  if (bN === val) b.classList.add('active-btn');
                });
                const lbl = document.getElementById('rsl-' + sec.k);
                if (lbl) { lbl.textContent = val + '/10'; lbl.className = 'rating-score-label ' + (val>=8?'green':val>=5?'yellow':'red'); }
                const badge = document.getElementById('asb-' + sec.k);
                if (badge) { badge.style.display='inline-block'; badge.textContent=val+'/10'; badge.className='acc-score-badge '+(val>=8?'s-g':val>=5?'s-y':'s-r'); }
              }
            }
          });
        }
      }
    });

    // Update brand/model in topbar
    if (extracted.brand || extracted.model) {
      const title = ((extracted.brand||'') + (extracted.model?' '+extracted.model:'')).trim();
      document.getElementById('add-title').textContent = title || t('new_review');
    }

    // Update overall score display
    updateOverallDisplay();

    // Open all accordions so user can see filled fields
    DEFS[curTab].sections.forEach(sec => {
      if (sec.k === 'photo' || sec.k === 'verdict') return;
      const body = document.getElementById('ab-' + sec.k);
      const arrow = document.getElementById('aar-' + sec.k);
      if (body) body.classList.add('open');
      if (arrow) arrow.classList.add('open');
    });

    status.textContent = t('paste_success');
    status.className = 'paste-status success';
    textarea.value   = '';
  } catch(e) {
    console.error('Parse error:', e);
    status.textContent = t('paste_error');
    status.className = 'paste-status error';
  }

  btn.disabled    = false;
  btn.textContent = t('paste_btn');
}

function buildPasteSection() {
  return `
  <div class="paste-box">
    <div class="paste-header">
      <div class="paste-icon">✨</div>
      <div>
        <div class="paste-title">${t('paste_title').replace('✨ ','')}</div>
        <div class="paste-sub">${t('paste_sub')}</div>
      </div>
    </div>
    <textarea id="paste-input" class="paste-textarea" placeholder="${t('paste_placeholder')}"></textarea>
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
      <button id="paste-btn" class="paste-btn" onclick="runPasteAndFill()">${t('paste_btn')}</button>
      <button class="paste-clear-btn" onclick="document.getElementById('paste-input').value=''">${t('paste_clear')}</button>
    </div>
    <div id="paste-status" class="paste-status"></div>
  </div>`;
}

// ===== APP STATE =====
let curTab = 'smartphone';

// ===== PAGE ROUTING =====
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  showPage('home');
  renderList();
}

function goAdd() {
  formData = {};
  formPhotoURL = null;
  editingReviewId = null;
  document.getElementById('add-title').textContent = 'New Review';
  document.getElementById('add-sub').textContent = TYPE_LABELS[curTab] + ' · Draft';
  document.getElementById('btn-complete').style.background = TYPE_COLORS[curTab];
  buildAccordions();
  showPage('add');
}

function goEditReview(id) {
  const r = loadReviews().find(x => x.id === id);
  if (!r) return;
  formData = { ...r };
  formPhotoURL = r.photo || null;
  editingReviewId = r.id;
  document.getElementById('add-title').textContent = (r.brand || '') + (r.model ? ' ' + r.model : '');
  document.getElementById('add-sub').textContent = TYPE_LABELS[r.type] + ' · Editing';
  document.getElementById('btn-complete').style.background = TYPE_COLORS[r.type];
  buildAccordions();
  populateForm(r);
  showPage('add');
}

function goDash() {
  selIds = loadReviews().filter(r => r.type === curTab).slice(0, 3).map(r => r.id);
  renderDash();
  showPage('dash');
}

// ===== TAB SWITCHING =====
function switchTab(tab, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  if (tab === 'sales') {
    showPage('sales');
    renderSalesHome();
    return;
  }

  curTab = tab;
  document.getElementById('cta-banner').style.background = TYPE_COLORS[tab];
  document.getElementById('cta-title').textContent = 'New ' + TYPE_LABELS[tab] + ' Review';
  showPage('home');
  renderList();
}

// ===== REVIEW LIST =====
function renderList() {
  const list = loadReviews().filter(r => r.type === curTab);
  const el   = document.getElementById('reviews-list');

  if (!list.length) {
    el.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="5" y="2" width="14" height="20" rx="2"/>
          <line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="13" y2="13"/>
        </svg>
        <p>No ${TYPE_LABELS[curTab]} reviews yet</p>
      </div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const ov   = calcOverall(r);
    const c    = scoreColor(ov);
    const circ = 2 * Math.PI * 17;
    const dash = ov ? (circ * ov / 10).toFixed(1) : '0';

    return `
    <div class="review-card" onclick="showDetail('${r.id}')">
      <div class="review-thumb">
        ${r.photo
          ? `<img src="${r.photo}" alt="${r.model || ''}">`
          : `<span style="font-size:18px">${EMOJIS[r.type]}</span>`}
      </div>
      <div class="review-info">
        <div class="review-brand">${r.brand || '—'}</div>
        <div class="review-model">${r.model || 'New Device'}</div>
        <div class="review-meta">
          ${r.retail_price ? `<span>R$ ${parseInt(r.retail_price).toLocaleString('pt-BR')}</span><span>·</span>` : ''}
          <span class="type-badge ${TYPE_CLASS[r.type]}">${TYPE_LABELS[r.type]}</span>
          <span>·</span>
          <span class="status-dot" style="background:${r.completed ? '#2ea043' : '#d29922'}"></span>
          <span>${r.completed ? 'Completed' : 'Draft'}</span>
        </div>
      </div>
      <div class="score-ring">
        <svg width="42" height="42" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="17" fill="none" stroke="#21262d" stroke-width="3"/>
          <circle cx="21" cy="21" r="17" fill="none" stroke="${c}" stroke-width="3"
            stroke-dasharray="${dash} ${circ.toFixed(1)}" stroke-linecap="round"/>
        </svg>
        <span class="score-ring-num" style="color:${c}">${ov ?? '—'}</span>
      </div>
    </div>`;
  }).join('');
}

// ===== SAVE ACTIONS =====
function quickSave() {
  const r = collectReview(false);
  updateReview(r);
  document.getElementById('add-title').textContent = (r.brand || '') + (r.model ? ' ' + r.model : '');

  btn.style.color = '#3fb950';
  setTimeout(() => { btn.style.color = ''; }, 1200);
}

function saveDraft() {
  const r = collectReview(false);
  updateReview(r);
  goHome();
}

function saveComplete() {
  const r = collectReview(true);
  updateReview(r);
  showDetail(r.id);
}

function deleteCurrentReview() {
  if (!editingReviewId) return;
  if (!confirm('Delete this review permanently?')) return;
  deleteReview(editingReviewId);
  editingReviewId = null;
  goHome();
}
